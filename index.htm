
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main Class="container">
        <h1>Money Tracker</h1>

        <section Class="balance-card">
            <p>Balance</p>
            <h2 id="balance">$0.00</h2>
            <div Class="summary">
            <div>
            <span>Income</span>
            <strong id="income">$0.00</strong>
            </div>

            <div>
                <spam>Expenses</spam>
                <strong id="expenses">$0.00</strong>

            </div>
        </div>
        </section>

    

        <section class="transaction-form">
            <h2>ADD Transaction</h2>

            <input type="text" id="description" placeholder="Description"> 
            <input type="number" id="amount" placeholder="Amount">

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expenses</option>
            </select>

        <input type="text" id="category" placeholder="category">
        <input type="date" id="date">

            <button id="add-btn">Add Transaction</button>
        </section>

        <div class="filters">
            <button id="all-btn">All</button>
            <button id="income-btn">Income</button>
            <button id="expense-btn">Expenses</button>

            <input type="month" id="month-filter">
            <input type="text" id="search-filter" placeholder="Search...">
        </div>

        <section class="transactions">
            <h2>Transaction</h2>
            <ul id="transaction-list"></ul>
        </section>

    </main>
    <script src="app.js"></script>

    
</body>
</html>
